services:
  ai-api:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /data/ai.sqlite3
    ports:
      - "${AI_BIND_HOST:-127.0.0.1}:${AI_PORT:-8088}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  ai-data:
